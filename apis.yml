description: >-
  Coterra Energy Inc. (formerly Cabot Oil & Gas, combined with Cimarex Energy in October 2021)
  was a Houston-headquartered independent oil and natural gas exploration and production company
  with positions in the Permian Basin, the Marcellus Shale and the Anadarko Basin. On May 7, 2026
  Coterra completed an all-stock merger with Devon Energy; the combined company operates as Devon
  Energy (NYSE: DVN), Coterra's shares were deregistered (Form 15-12G filed 2026-05-19) and
  investors.coterra.com now redirects to investors.devonenergy.com. The coterra.com site has been
  reduced to a five-page holding site for interest owners. Coterra never operated a public
  developer program or API: owner statements are delivered through EnergyLink and production data
  through PDS Energy, both third-party platforms. The only programmatic access to Coterra data is
  the SEC's own EDGAR API, listed here as a clearly labeled third-party government API.
