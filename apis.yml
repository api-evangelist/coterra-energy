apis:
  - aid: coterra-energy:sec-edgar-filings
    name: SEC EDGAR Filings (Coterra Energy, CIK 858470)
    description: >-
      Machine-readable filing data for Coterra Energy is available from the U.S. Securities and
      Exchange Commission, not from the company. The SEC EDGAR submissions API returns the full
      filing history for CIK 0000858470 (formerly Cabot Oil & Gas Corp until 2021-09-29) as JSON,
      including the Form 15-12G deregistration filed after the Devon Energy merger. This is a
      third-party government API listed here because it is the only real programmatic access to
      this company's data.
    humanURL: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
    baseURL: https://data.sec.gov
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    tags:
      - Filings
      - SEC EDGAR
      - Third Party
    properties:
      - type: Documentation
        url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
      - type: APIReference
        url: https://data.sec.gov/submissions/CIK0000858470.json
    x-evidence:
      verified: '2026-09-19'
      method: fetched documentation and called the endpoint
      documentation: >-
        The SEC's EDGAR APIs page documents RESTful JSON APIs on data.sec.gov —
        https://data.sec.gov/submissions/CIK##########.json plus the XBRL companyconcept,
        companyfacts and frames APIs. No authentication or API key required; a declared
        User-Agent and a 10-request-per-second ceiling are the stated fair-access terms.
      endpoint_check: >-
        GET https://data.sec.gov/submissions/CIK0000858470.json returned HTTP 200 with JSON naming
        "Coterra Energy Inc.", an empty tickers[] list, the former name "CABOT OIL & GAS CORP"
        through 2021-09-29, and a Form 15-12G filed 2026-05-19.
